<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="45%" stopColor="#22d3ee" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left-to-Right diagonal: handle loop at bottom-left, arrow tip at top-right -->
  <g filter="url(#subtleGlow)" stroke="url(#crossGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bottom-left ring/loop -->
    <circle cx="16" cy="48" r="4.5" stroke-width="4" />
    <!-- Diagonal shaft with arrow tip -->
    <path d="M19 45 L46 18" stroke-width="4.5" />
    <!-- Arrow head at top-right -->
    <path d="M37 15 L49 15 L49 27" stroke-width="4" fill="none" />

    <!-- Top-left to Bottom-right cross piece -->
    <!-- Top-left ring/loop -->
    <circle cx="16" cy="16" r="4.5" stroke-width="4" />
    <!-- Diagonal shaft -->
    <path d="M19 19 L48 48" stroke-width="4.5" />
    <!-- Bottom-right loop/finial -->
    <circle cx="48" cy="48" r="4.5" stroke-width="4" />
  </g>
</svg>
